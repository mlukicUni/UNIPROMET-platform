<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoring | UNIPROMET IT ADMIN</title>
  <meta name="theme-color" content="#090b0f">
  <link rel="icon" type="image/png" href="/assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components/monitoring.css">
</head>
<body class="unipromet-theme mon-window">

  <!-- Traka koja se pojavljuje pri pomeranju miša -->
  <div class="mon-window-bar" id="mw-bar">
    <img src="/assets/unipromet_logo.png" alt="UNIPROMET" class="mon-window-logo">
    <div style="min-width: 0;">
      <div class="mon-window-title" id="mw-title">Monitoring</div>
      <div class="mon-window-sub" id="mw-sub"></div>
    </div>
    <div class="mon-window-tools">
      <div class="mon-tool-group" id="mw-rotation-group" style="display: none;">
        <button type="button" class="mon-tool-btn" id="mw-btn-rotation" title="Pokreni / zaustavi rotaciju tabova (razmak)"><i data-lucide="repeat"></i><span>Rotacija</span></button>
        <button type="button" class="mon-tool-btn mon-tool-icon" id="mw-btn-rotation-settings" title="Podešavanja rotacije"><i data-lucide="settings-2"></i></button>
      </div>
      <button type="button" class="mon-tool-btn" id="mw-btn-fullscreen" title="Ceo ekran (F)"><i data-lucide="maximize"></i><span>Ceo ekran</span></button>
      <button type="button" class="mon-tool-btn mon-tool-icon" id="mw-btn-close" title="Zatvori prozor"><i data-lucide="x"></i></button>
    </div>
  </div>

  <div class="mon-stage" id="mw-stage">
    <div class="mon-stage-grid" id="mw-grid"></div>
    <div class="mon-stage-banner" id="mw-banner"></div>
    <div class="mon-rotation-bar" id="mw-rotation-bar"><span></span></div>
    <div class="telemetry-loading-state" id="mw-loading">
      <div class="spinner-circle"></div>
      <h5>Učitavanje monitoringa...</h5>
    </div>
  </div>

  <!-- Podešavanja rotacije (isti izgled kao na platformi) -->
  <div class="modal-overlay" id="mw-modal-rotation" style="display: none;">
    <div class="modal-window modal-glass eq-modal-window" style="max-width: 520px; width: 95vw;">
      <div class="modal-header">
        <div class="modal-title-wrap">
          <div class="modal-icon-circle" style="background: rgba(255, 184, 0, 0.15); color: var(--yellow-primary);"><i data-lucide="repeat"></i></div>
          <div>
            <h3 class="modal-title">Rotacija tabova</h3>
            <p class="modal-subtitle">Tabovi se automatski smenjuju — za zidne i nadzorne monitore</p>
          </div>
        </div>
        <button class="modal-close-icon" type="button" title="Zatvori"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body-content" style="padding: 18px 24px; display: flex; flex-direction: column; gap: 16px;">
        <div class="form-group">
          <label for="mw-rot-interval"><i data-lucide="timer" style="width: 14px; height: 14px; color: var(--yellow-primary);"></i> Smena na svakih</label>
          <div class="modal-input-wrap">
            <i data-lucide="timer" class="modal-input-icon"></i>
            <select id="mw-rot-interval" class="glass-select has-icon">
              <option value="10">10 sekundi</option>
              <option value="15">15 sekundi</option>
              <option value="30">30 sekundi</option>
              <option value="45">45 sekundi</option>
              <option value="60">1 minut</option>
              <option value="120">2 minuta</option>
              <option value="300">5 minuta</option>
              <option value="600">10 minuta</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label><i data-lucide="list-checks" style="width: 14px; height: 14px; color: var(--yellow-primary);"></i> Tabovi u rotaciji</label>
          <div class="mon-rot-list" id="mw-rot-list"></div>
          <span class="mon-gallery-note">Ako nijedan nije označen, rotiraju se svi tabovi.</span>
        </div>
      </div>
      <div class="modal-bottom-actions mon-modal-footer">
        <button type="button" class="btn-dark-outline-sm btn-modal-cancel"><span>Otkaži</span></button>
        <button type="button" class="btn-yellow-solid-sm" id="mw-btn-rot-save"><i data-lucide="check"></i><span>Sačuvaj i pokreni</span></button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/core/video-stream.js"></script>
  <script src="/js/monitoringCore.js"></script>
  <script src="/js/monitorWindow.js"></script>
</body>
</html>
