<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamera | UNIPROMET IT ADMIN</title>
  <meta name="theme-color" content="#090b0f">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <!--
    Samostalna stranica jedne kamere (veza iz Excel izvoza: /kamera/<ID>).
    Namerno ne učitava ništa od platforme (bez menija, fontova sa interneta i ostalih skripti) - samo video i osnovne komande.
  -->
  <style>
    :root { --bg: #090b0f; --panel: #11151c; --line: rgba(255,255,255,.12); --text: #e8edf4; --dim: #94a3b8; --yellow: #ffb800; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; overflow: hidden; }
    .bar { position: fixed; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: linear-gradient(180deg, rgba(9,11,15,.96), rgba(9,11,15,.78)); border-bottom: 1px solid var(--line); z-index: 5; transition: opacity .25s; }
    .bar.is-hidden { opacity: 0; pointer-events: none; }
    .bar img { height: 26px; }
    .title { min-width: 0; flex: 1; }
    .title b { display: block; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title span { display: block; font-size: 11.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tools { display: flex; gap: 8px; flex-shrink: 0; }
    .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); font-size: 12.5px; font-weight: 600; cursor: pointer; text-decoration: none; }
    .btn:hover { background: rgba(255,255,255,.12); }
    .btn.is-on { background: rgba(255,184,0,.18); border-color: rgba(255,184,0,.5); color: var(--yellow); }
    .live-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: .08em; color: #ef4444; }
    .live-tag i { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: pulse 1.4s infinite; }
    @keyframes pulse { 50% { opacity: .3; } }
    .stage { position: fixed; inset: 0; background: #000; }
    .stage video-stream { display: block; width: 100%; height: 100%; }
    .stage video-stream video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .stage video-stream .info { display: none; }
    .stage video::-webkit-media-controls { display: none !important; }
    .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; z-index: 4; pointer-events: none; }
    .overlay.has-actions { pointer-events: auto; }
    .overlay p { margin: 0; max-width: 520px; font-size: 15px; line-height: 1.5; }
    .overlay .dim { color: var(--dim); font-size: 13px; }
    .spinner { width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: var(--yellow); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden { display: none !important; }
    @media (max-width: 560px) { .btn span { display: none; } .title span { display: none; } }
  </style>
</head>
<body>
  <div class="bar" id="bar">
    <img src="/assets/unipromet_logo.png" alt="UNIPROMET">
    <div class="title">
      <b id="cam-name">Kamera</b>
      <span id="cam-sub"></span>
    </div>
    <span class="live-tag hidden" id="live-tag"><i></i>UŽIVO</span>
    <div class="tools">
      <button type="button" class="btn is-on" id="btn-sd" title="Brži prikaz (manja rezolucija)"><span>Brzo</span></button>
      <button type="button" class="btn" id="btn-hd" title="Glavni tok (veća rezolucija, sporije)"><span>HD</span></button>
      <button type="button" class="btn" id="btn-full" title="Ceo ekran (F)"><span>Ceo ekran</span></button>
      <a class="btn" id="btn-platform" href="/" title="Otvori ovu kameru u platformi (snimci i ostalo)"><span>Otvori u platformi</span></a>
    </div>
  </div>

  <div class="stage" id="stage"></div>

  <div class="overlay" id="overlay">
    <div class="spinner" id="spinner"></div>
    <p id="msg">Povezivanje sa kamerom...</p>
    <p class="dim" id="msg-sub"></p>
    <div id="actions" class="hidden"><button type="button" class="btn" id="btn-retry"><span>Pokušaj ponovo</span></button></div>
  </div>

  <!-- Podaci o kameri ubacuje server (isto proverava pravo korisnika) -->
  <script>window.__CAMERA__ = /*__CAMERA__*/null;</script>
  <script type="module" src="/js/core/video-stream.js"></script>
  <script src="/js/cameraWindow.js"></script>
</body>
</html>
